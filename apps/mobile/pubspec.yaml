name: sakina
description: Sakina — messenger for Tajikistan.
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Deliberately few dependencies. Every package is weight in the APK, and the
  # target device is a cheap low-RAM Android on metered data.
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
